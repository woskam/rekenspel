<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introductie - Brugklas Engels</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .lesson-container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .lesson-container h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .lesson-container .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .podcast-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .podcast-card h2 {
            color: #2d5016;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .podcast-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        .games-section {
            margin-top: 30px;
        }

        .games-section h2 {
            color: white;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .no-games {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="../index.html" class="back-link">← Terug naar Brugklas</a>
        <div class="lesson-container">
            <h1>Les 1: Introductie</h1>
            <p class="subtitle">Introductie brugklas Engels</p>

            <div class="podcast-card">
                <div class="podcast-icon">🎧</div>
                <h2>Luister naar de podcast</h2>
                <audio controls>
                    <source src="../../podcasts/Introductie%20brugklas%20Engels.m4a" type="audio/x-m4a">
                    Je browser ondersteunt geen audio.
                </audio>
            </div>

            <div class="games-section">
                <h2>Spellen</h2>
                <div class="no-games">
                    <p>Spellen worden binnenkort toegevoegd</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
