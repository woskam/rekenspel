<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introductie - Brugklas Engels</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .lesson-container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .lesson-container h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .lesson-container .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .podcast-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .podcast-card h2 {
            color: #2d5016;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .podcast-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        .games-section {
            margin-top: 30px;
        }

        .games-section h2 {
            color: white;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (max-width: 500px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
        }

        .game-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: #2d5016;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            display: block;
        }

        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .game-card .game-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .game-card h3 {
            font-size: 1.2em;
            margin-bottom: 5px;
            color: #2d5016;
        }

        .game-card p {
            color: #666;
            font-size: 0.9em;
            margin: 0;
        }

        .wordlist-card {
            background: #e8f5e9;
            border: 2px solid #2d5016;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="../index.html" class="back-link">← Terug naar Brugklas</a>
        <div class="lesson-container">
            <h1>Les 1: Introductie</h1>
            <p class="subtitle">Introductie brugklas Engels</p>

            <div class="podcast-card">
                <div class="podcast-icon">🎧</div>
                <h2>Luister naar de podcast</h2>
                <audio controls preload="metadata">
                    <source src="../../podcasts/Introductie%20brugklas%20Engels.m4a" type="audio/x-m4a">
                    Je browser ondersteunt geen audio.
                </audio>
            </div>

            <div class="games-section">
                <h2>Leren</h2>
                <div class="games-grid">
                    <a href="woordenlijst.html" class="game-card wordlist-card">
                        <div class="game-icon">📚</div>
                        <h3>Woordenlijst</h3>
                        <p>Bekijk alle woorden en zinnen</p>
                    </a>
                    <a href="flashcards.html" class="game-card">
                        <div class="game-icon">🎴</div>
                        <h3>Flashcards</h3>
                        <p>Oefen met omdraaien</p>
                    </a>
                    <a href="multiple-choice.html" class="game-card">
                        <div class="game-icon">🎯</div>
                        <h3>Multiple Choice</h3>
                        <p>Kies de juiste vertaling</p>
                    </a>
                    <a href="memory.html" class="game-card">
                        <div class="game-icon">🧠</div>
                        <h3>Memory</h3>
                        <p>Match NL en EN woorden</p>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
