<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leren met Spellen</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .home-container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .home-container h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .home-container .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.3em;
            margin-bottom: 50px;
            line-height: 1.6;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        @media (min-width: 700px) {
            .subjects-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 500px) and (max-width: 699px) {
            .subjects-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .subject-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-decoration: none;
            color: #2d5016;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .subject-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .subject-card h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #2d5016;
        }

        .subject-card p {
            color: #666;
            font-size: 1em;
            margin: 0;
            line-height: 1.5;
        }

        .subject-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .subject-card.coming-soon {
            opacity: 0.6;
            pointer-events: none;
            position: relative;
        }

        .subject-card.coming-soon::after {
            content: 'Binnenkort';
            position: absolute;
            top: 15px;
            right: 15px;
            background: #999;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .games-count {
            display: inline-block;
            background: #e8f5e9;
            color: #2d5016;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="home-container">
            <h1>Leren met Spellen</h1>
            <p class="subtitle">Kies een vak en leer spelenderwijs!</p>

            <div class="subjects-grid">
                <!-- Wiskunde -->
                <a href="rekenspel/index.html" class="subject-card">
                    <div class="subject-icon">🔢</div>
                    <h2>Wiskunde</h2>
                    <p>Oefen tafels van 11 tot 20 met slimme rekenstrategieën</p>
                    <span class="games-count">4 spellen</span>
                </a>

                <!-- Engels -->
                <a href="engels/index.html" class="subject-card">
                    <div class="subject-icon">🇬🇧</div>
                    <h2>Engels</h2>
                    <p>Leer Engelse woordjes en zinnen</p>
                    <span class="games-count">Brugklas</span>
                </a>

                <!-- Frans -->
                <a href="frans/index.html" class="subject-card coming-soon">
                    <div class="subject-icon">🇫🇷</div>
                    <h2>Frans</h2>
                    <p>Leer Franse woordjes en zinnen</p>
                    <span class="games-count">0 spellen</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
