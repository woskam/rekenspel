<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frans - Leren met Spellen</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .home-container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .home-container h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .home-container p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2em;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .coming-soon-message {
            background: white;
            border-radius: 15px;
            padding: 50px 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .coming-soon-message h2 {
            color: #2d5016;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .coming-soon-message p {
            color: #666;
            font-size: 1.1em;
        }

        .coming-soon-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="../index.html" class="back-link">← Terug naar overzicht</a>
        <div class="home-container">
            <h1>Frans</h1>
            <p>Leer Franse woordjes en zinnen met leuke spellen!</p>

            <div class="coming-soon-message">
                <div class="coming-soon-icon">🇫🇷</div>
                <h2>Binnenkort beschikbaar!</h2>
                <p>We werken hard aan nieuwe Franse spellen. Kom snel terug!</p>
            </div>
        </div>
    </div>
</body>
</html>
