<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekenspel - Tafels Boven de 10</title>
    <link rel="stylesheet" href="css/styles.css?v=2">
<link rel="icon" href="/app/img/icon.png">
</head>
<body>
<a class="ag-home" href="/"><img src="/app/img/icon.png" alt="">ArtGames</a>
    <div class="game-container">
        <a href="index.html" class="back-link">← Terug naar Home</a>
        
        <h1>Rekenspel - Tafels</h1>
        
        <div class="score-info">
            <div class="score-item">Score: <span id="score">0</span></div>
            <div class="score-item">Vraag: <span id="question-number">1</span></div>
        </div>

        <!-- Vraag en invoer -->
        <div class="question-box">
            <div class="question" id="question">0 × 0 =</div>
            
            <div class="input-group">
                <input 
                    type="number" 
                    id="answer-input" 
                    placeholder="Antwoord..." 
                    autofocus>
                <button id="submit-btn" onclick="checkAnswer()">Controleer</button>
            </div>
        </div>

        <!-- Rekenstrategieën -->
        <div class="strategies-box" id="strategies-box">
            <details>
                <summary>💡 Rekenmanieren</summary>
                <div id="strategies"></div>
            </details>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="stats">
            <div class="stat">Goed: <span id="correct-count">0</span></div>
            <div class="stat">Fout: <span id="incorrect-count">0</span></div>
        </div>

        <button onclick="resetGame()" class="reset-btn">↺ Nieuw spel</button>
    </div>

    <script src="src/game.js"></script>
    <script src="/assets/progress.js?v=2"></script>
    <script>
AG.spel({ id: "rekenen-tafels", titel: "Tafels oefenen", vak: "rekenen" });
AG.naAfloop("updateDisplay", function () { return questionCount > 0 && questionCount % 10 === 0 ? { deel: "Grote tafels", procent: Math.round(correctCount / questionCount * 100), tekst: correctCount + " van de " + questionCount + " goed" } : null; });
    </script>
</body>
</html>
